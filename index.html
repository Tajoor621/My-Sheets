<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express Tracker Pro</title>
    <link rel="manifest" href="/My-Sheets/manifest.json">
<meta name="theme-color" content="#0b1120">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #f0f3fa;
            margin-bottom: 6px;
        }

        .subhead {
            color: #99aacd;
            font-size: 15px;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-row input,
        .input-row select {
            flex: 1;
            min-width: 140px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: #f0f3fa;
            transition: all 0.3s;
        }

        .input-row input::placeholder {
            color: #667799;
        }

        .input-row input:focus,
        .input-row select:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
        }

        .input-row select option {
            background: #1a2332;
            color: #f0f3fa;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }

        .btn-add:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .summary {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary span {
            color: #99aacd;
            font-size: 14px;
        }

        .summary .total {
            color: #f0f3fa;
            font-size: 20px;
            font-weight: 700;
        }

        .summary .total span {
            color: #3b82f6;
            font-size: 22px;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .expense-list::-webkit-scrollbar {
            width: 4px;
        }

        .expense-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .expense-list::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        .expense-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .expense-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .expense-item .info .desc {
            color: #f0f3fa;
            font-size: 15px;
            font-weight: 500;
        }

        .expense-item .info .category {
            color: #99aacd;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .expense-item .amount {
            color: #f0f3fa;
            font-weight: 600;
            font-size: 16px;
        }

        .expense-item .amount.positive {
            color: #4ade80;
        }

        .expense-item .amount.negative {
            color: #f87171;
        }

        .btn-delete {
            background: rgba(248, 113, 113, 0.15);
            border: none;
            color: #f87171;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: rgba(248, 113, 113, 0.3);
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            color: #667799;
            padding: 40px 20px;
            font-size: 15px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .input-row {
                flex-direction: column;
            }

            .input-row input,
            .input-row select,
            .btn-add {
                min-width: 100%;
            }

            .summary {
                flex-direction: column;
                gap: 6px;
            }

            .expense-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .expense-item .info {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📊 Express Tracker Pro</h1>
            <p class="subhead">Track your daily expenses smartly</p>
        </div>

        <div class="input-row">
            <input type="text" id="expenseInput" placeholder="What did you spend on?" />
            <input type="number" id="amountInput" placeholder="Amount (₨)" />
            <select id="categorySelect">
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">📄 Bills</option>
                <option value="Entertainment">🎮 Entertainment</option>
                <option value="Other">📌 Other</option>
            </select>
            <button class="btn-add" onclick="addExpense()">➕ Add</button>
        </div>

        <div class="summary">
            <span>Total Expenses</span>
            <div class="total">₨ <span id="totalAmount">0</span></div>
        </div>

        <div class="expense-list" id="expenseList">
            <div class="empty-state">
                <div class="icon">📭</div>
                No expenses yet. Add your first one above!
            </div>
        </div>
    </div>

    <script>
        let expenses = [];

        // Load from localStorage
        function loadExpenses() {
            const saved = localStorage.getItem('expenses');
            if (saved) {
                try {
                    expenses = JSON.parse(saved);
                } catch (e) {
                    expenses = [];
                }
            }
            renderExpenses();
        }

        // Save to localStorage
        function saveExpenses() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        // Add expense
        function addExpense() {
            const desc = document.getElementById('expenseInput').value.trim();
            const amount = parseFloat(document.getElementById('amountInput').value);
            const category = document.getElementById('categorySelect').value;

            if (!desc) {
                alert('Please enter a description!');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount!');
                return;
            }

            expenses.push({
                id: Date.now(),
                description: desc,
                amount: amount,
                category: category,
                date: new Date().toLocaleDateString()
            });

            saveExpenses();
            renderExpenses();
            clearInputs();
        }

        // Delete expense
        function deleteExpense(id) {
            if (confirm('Delete this expense?')) {
                expenses = expenses.filter(exp => exp.id !== id);
                saveExpenses();
                renderExpenses();
            }
        }

        // Render expenses
        function renderExpenses() {
            const list = document.getElementById('expenseList');
            const totalSpan = document.getElementById('totalAmount');

            if (expenses.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        No expenses yet. Add your first one above!
                    </div>
                `;
                totalSpan.textContent = '0';
                return;
            }

            let total = 0;
            list.innerHTML = expenses.map(exp => {
                total += exp.amount;
                return `
                    <div class="expense-item">
                        <div class="info">
                            <span class="desc">${escapeHTML(exp.description)}</span>
                            <span class="category">${exp.category}</span>
                            <span style="color:#667799;font-size:12px;">${exp.date || ''}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:12px;">
                            <span class="amount positive">₨ ${exp.amount.toFixed(2)}</span>
                            <button class="btn-delete" onclick="deleteExpense(${exp.id})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalSpan.textContent = total.toFixed(2);
        }

        // Helper: Escape HTML
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Clear inputs
        function clearInputs() {
            document.getElementById('expenseInput').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('categorySelect').selectedIndex = 0;
            document.getElementById('expenseInput').focus();
        }

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'expenseInput' || active.id === 'amountInput') {
                    addExpense();
                }
            }
        });

        // Load on start
        loadExpenses();
    </script>
</body>
</html>
