<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 40px 35px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f3fa;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #8899bb;
            margin-left: auto;
        }
        .subhead {
            color: #99aacd;
            font-size: 15px;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
            margin-bottom: 28px;
        }
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .input-row input,
        .input-row select {
            flex: 1 1 130px;
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(0, 0, 0, 0.35);
            color: #eef3fc;
            font-size: 15px;
            outline: none;
        }
        .input-row input:focus,
        .input-row select:focus {
            border-color: #3b82f6;
            background: rgba(0, 0, 0, 0.55);
        }
        .input-row input::placeholder {
            color: #6a7fa0;
        }
        .input-row select option {
            background: #1a2332;
            color: #eef3fc;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 1 auto;
        }
        .btn-primary {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.30);
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline {
            background: transparent;
            color: #bcc9e6;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #3b82f6;
            color: #fff;
        }
        .btn-voice {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.30);
        }
        .btn-voice:hover {
            background: #6d28d9;
        }
        .btn-voice.listening {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .status {
            background: rgba(0, 0, 0, 0.30);
            border-radius: 24px;
            padding: 18px 22px;
            margin-bottom: 22px;
            color: #d3def5;
            font-size: 15px;
            min-height: 60px;
            border-left: 4px solid #3b82f6;
            display: flex;
            align-items: center;
        }
        .status .emoji {
            font-size: 22px;
            margin-right: 12px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            color: #8899bb;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0 4px 8px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .expense-list {
            list-style: none;
            margin-top: 6px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .expense-list::-webkit-scrollbar {
            width: 5px;
        }
        .expense-list::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 12px 12px 16px;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #eef3fc;
        }
        .expense-item .left {
            display: flex;
            flex-direction: column;
        }
        .expense-item .left .title {
            font-weight: 500;
            font-size: 16px;
        }
        .expense-item .left .meta {
            font-size: 12px;
            color: #7788aa;
            margin-top: 2px;
        }
        .expense-item .amount {
            font-weight: 700;
            font-size: 17px;
            color: #a5f3b0;
        }
        .expense-item .amount.expense {
            color: #fca5a5;
        }
        .expense-item .delete-btn {
            background: none;
            border: none;
            color: #6a7fa0;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
        }
        .expense-item .delete-btn:hover {
            color: #ef4444;
        }
        .empty-msg {
            color: #6a7fa0;
            text-align: center;
            padding: 30px 0 18px 0;
            font-style: italic;
            font-size: 14px;
        }
        .summary {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: #ccd8f0;
            font-size: 15px;
        }
        .summary span {
            font-weight: 700;
            font-size: 18px;
        }
        .summary .total-income {
            color: #a5f3b0;
        }
        .summary .total-expense {
            color: #fca5a5;
        }
        .summary .balance {
            color: #93bbfc;
        }
        @media (max-width: 480px) {
            .card { padding: 28px 18px; }
            h1 { font-size: 22px; }
            .btn { padding: 12px 16px; font-size: 14px; }
            .input-row input,
            .input-row select { padding: 12px 14px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📊 Expense Tracker <small>v2.0</small></h1>
    <div class="subhead">💰 Daily · Monthly · Voice</div>
    <div class="input-row">
        <input type="text" id="descInput" placeholder="e.g. Coffee" />
        <input type="number" id="amountInput" placeholder="Amount" step="0.01" />
        <select id="typeSelect">
            <option value="income">➕ Income</option>
            <option value="expense" selected>➖ Expense</option>
        </select>
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" id="addBtn">➕ Add</button>
        <button class="btn btn-voice" id="voiceBtn">🎤 Voice</button>
        <button class="btn btn-outline" id="clearBtn">✕ Clear All</button>
    </div>
    <div class="status" id="status">
        <span class="emoji">📌</span>
        <span id="statusText">Ready — add an expense or use voice</span>
    </div>
    <div class="list-header">
        <span>Description</span>
        <span>Amount</span>
    </div>
    <ul class="expense-list" id="expenseList">
        <li class="empty-msg">✨ No records yet</li>
    </ul>
    <div class="summary">
        <div>💰 Income <span class="total-income" id="totalIncome">0</span></div>
        <div>💸 Expense <span class="total-expense" id="totalExpense">0</span></div>
        <div>⚖️ Balance <span class="balance" id="balance">0</span></div>
    </div>
</div>
<script>
    (function() {
        "use strict";
        const descInput = document.getElementById('descInput');
        const amountInput = document.getElementById('amountInput');
        const typeSelect = document.getElementById('typeSelect');
        const addBtn = document.getElementById('addBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusText = document.getElementById('statusText');
        const statusEmoji = document.querySelector('.status .emoji');
        const expenseList = document.getElementById('expenseList');
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const balanceEl = document.getElementById('balance');

        let transactions = [];
        let isListening = false;

        function setStatus(emoji, msg) {
            statusEmoji.textContent = emoji || '📌';
            statusText.textContent = msg || 'Ready';
        }

        function formatCurrency(val) {
            return 'Rs. ' + Number(val).toFixed(2);
        }

        function render() {
            expenseList.innerHTML = '';
            if (transactions.length === 0) {
                expenseList.innerHTML = '<li class="empty-msg">✨ No records yet</li>';
            } else {
                const reversed = [...transactions].reverse();
                for (const t of reversed) {
                    const li = document.createElement('li');
                    li.className = 'expense-item';
                    const left = document.createElement('div');
                    left.className = 'left';
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'title';
                    titleSpan.textContent = t.description || 'Untitled';
                    const metaSpan = document.createElement('span');
                    metaSpan.className = 'meta';
                    metaSpan.textContent = t.type.charAt(0).toUpperCase() + t.type.slice(1) + ' • ' + new Date(t.id).toLocaleString();
                    left.appendChild(titleSpan);
                    left.appendChild(metaSpan);
                    const amtSpan = document.createElement('span');
                    amtSpan.className = 'amount' + (t.type === 'expense' ? ' expense' : '');
                    amtSpan.textContent = (t.type === 'expense' ? '- ' : '+ ') + formatCurrency(t.amount);
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '✕';
                    delBtn.setAttribute('data-id', t.id);
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.getAttribute('data-id'));
                        transactions = transactions.filter(item => item.id !== id);
                        render();
                        updateSummary();
                        setStatus('🗑️', 'Record deleted');
                    });
                    li.appendChild(left);
                    li.appendChild(amtSpan);
                    li.appendChild(delBtn);
                    expenseList.appendChild(li);
                }
            }
            updateSummary();
        }

        function updateSummary() {
            let totalInc = 0;
            let totalExp = 0;
            for (const t of transactions) {
                if (t.type === 'income') totalInc += t.amount;
                else totalExp += t.amount;
            }
            const bal = totalInc - totalExp;
            totalIncomeEl.textContent = formatCurrency(totalInc);
            totalExpenseEl.textContent = formatCurrency(totalExp);
            balanceEl.textContent = formatCurrency(bal);
        }

        function addTransaction() {
            const desc = descInput.value.trim() || 'Untitled';
            const amount = parseFloat(amountInput.value.trim());
            if (isNaN(amount) || amount <= 0) {
                setStatus('⚠️', 'Please enter a valid positive amount');
                return false;
            }
            const type = typeSelect.value;
            transactions.push({
                id: Date.now(),
                description: desc,
                amount: amount,
                type: type
            });
            descInput.value = '';
            amountInput.value = '';
            typeSelect.value = 'expense';
            render();
            setStatus('✅', `Added ${type}: ${desc} — ${formatCurrency(amount)}`);
            return true;
        }

        function clearAll() {
            if (transactions.length === 0) {
                setStatus('📭', 'Nothing to clear');
                return;
            }
            if (confirm('Delete all records?')) {
                transactions = [];
                render();
                setStatus('🗑️', 'All records cleared');
            }
        }

        function initVoice() {
            if (!('SpeechRecognition' in window) && !('webkitSpeechRecognition' in window)) {
                setStatus('❌', 'Voice not supported in this browser');
                voiceBtn.style.display = 'none';
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            voiceBtn.addEventListener('click', function() {
                if (isListening) {
                    try { recognition.stop(); } catch (_) {}
                    voiceBtn.classList.remove('listening');
                    isListening = false;
                    setStatus('⏹️', 'Stopped listening');
                    return;
                }
                try {
                    recognition.start();
                    voiceBtn.classList.add('listening');
                    isListening = true;
                    setStatus('🎤', 'Listening... speak now');
                } catch (e) {
                    setStatus('❌', 'Error starting mic: ' + e.message);
                    voiceBtn.classList.remove('listening');
                    isListening = false;
                }
            });

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim();
                voiceBtn.classList.remove('listening');
                isListening = false;
                setStatus('🎯', 'You said: "' + transcript + '"');
                const words = transcript.split(/\s+/);
                let amount = null;
                let descParts = [];
                let type = 'expense';
                for (let i = 0; i < words.length; i++) {
                    const w = words[i].toLowerCase();
                    const num = parseFloat(w.replace(/,/g, ''));
                    if (!isNaN(num) && num > 0) {
                        amount = num;
                    } else if (w === 'income' || w === 'earning' || w === 'salary' || w === 'credit') {
                        type = 'income';
                    } else if (w === 'expense' || w === 'spent' || w === 'debit' || w === 'cost') {
                        type = 'expense';
                    } else {
                        descParts.push(w);
                    }
                }
                if (amount === null) {
                    for (let i = words.length - 1; i >= 0; i--) {
                        const num = parseFloat(words[i].replace(/,/g, ''));
                        if (!isNaN(num) && num > 0) {
                            amount = num;
                            descParts = descParts.filter(p => p !== words[i]);
                            break;
                        }
                    }
                }
                if (amount === null) {
                    setStatus('❓', 'Could not detect amount. Try "coffee 200"');
                    return;
                }
                const description = descParts.join(' ') || 'Voice entry';
                transactions.push({
                    id: Date.now(),
                    description: description,
                    amount: amount,
                    type: type
                });
                render();
                setStatus('✅', `Voice added: ${description} — ${formatCurrency(amount)} (${type})`);
            };

            recognition.onerror = function(event) {
                voiceBtn.classList.remove('listening');
                isListening = false;
                if (event.error === 'not-allowed') {
                    setStatus('❌', 'Microphone access denied. Please allow in browser settings.');
                } else if (event.error === 'no-speech') {
                    setStatus('🔇', 'No speech detected. Try again.');
                } else {
                    setStatus('❌', 'Voice error: ' + event.error);
                }
            };

            recognition.onend = function() {
                voiceBtn.classList.remove('listening');
                isListening = false;
            };
        }

        addBtn.addEventListener('click', addTransaction);
        clearBtn.addEventListener('click', clearAll);
        [descInput, amountInput].forEach(inp => {
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTransaction();
                }
            });
        });

        initVoice();
        render();
        setStatus('📌', 'Ready — add an expense or use voice');
        window.__app = { transactions, render, addTransaction, clearAll };
    })();
</script>
</body>
</html>⁶
